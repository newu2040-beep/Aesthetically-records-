name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version: ${JAVA_VER}"
          JAVA_MAJOR=$(echo "${JAVA_VER}" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to detect active Java major version."
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer. Found: ${JAVA_MAJOR}"
            exit 1
          fi
          echo "Java environment verified successfully (Major version: ${JAVA_MAJOR})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary debug keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            echo "Searching app/build/outputs/apk directory for generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::Debug APK at ${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::File does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Verified debug APK exists: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}" 2>/dev/null || wc -c < "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${TEMP_DIR}"
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "${REPO_RAW}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "${REPO_NAME}" ]; then
            REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TARGET_PATH}"
          if [ ! -f "${TARGET_PATH}" ] || [ ! -s "${TARGET_PATH}" ]; then
            echo "::error::Failed to prepare release asset at ${TARGET_PATH}."
            exit 1
          fi
          echo "Prepared release asset: ${TARGET_PATH}"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI availability..."
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Release asset not found or empty at ${ASSET_PATH}."
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat << 'EOF'
          ### Debug APK Build Information
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Notice**: This APK is intended for testing and development purposes. It is not a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )
          echo "Creating GitHub Release with tag: ${TAG_NAME}..."
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "${TAG_NAME}" || true
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: ${TAG_NAME}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "### 🚀 Debug APK Released Successfully!"
              echo ""
              echo "- **Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})"
              echo "- **Release Tag**: \`${TAG_NAME}\`"
              echo "- **Downloadable APK**: Direct download is available under the **Assets** section of the [Release Page](${RELEASE_URL}) (\`${ASSET_NAME}\`)."
              echo "- **Actions Artifact Backup**: The standard \`app-debug-apk\` artifact is also available from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an error."
            echo "APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "### ⚠️ Debug APK Build & Artifact Status"
              echo ""
              echo "- **Build Status**: APK build succeeded."
              echo "- **Actions Artifact**: \`app-debug-apk\` was uploaded successfully and can be downloaded from the Summary page of this GitHub Actions run."
              echo "- **Release Publishing Note**: Automatic release publishing could not complete or was skipped. Please use the \`app-debug-apk\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
